<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'none'; frame-ancestors 'self'"
    />
    <title>Local Vault Add-on</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Local Vault</h1>
      <p>state: <span id="state">booting</span></p>
      <p class="muted">
        Files you add here stay on this device. Sending to a peer goes directly over the WebRTC
        data channel — never through a server. Single-frame, ≤ 64 KiB per file.
      </p>
      <div class="row">
        <input id="picker" type="file" />
        <button id="btn-add" type="button">add to vault</button>
      </div>
      <p class="status" id="op-status" aria-live="polite"></p>
      <h2>Stored files</h2>
      <ul id="list" class="list"></ul>
      <h2>Received from peer</h2>
      <ul id="inbox" class="list"></ul>
    </main>
    <script src="addon.js"></script>
  </body>
</html>
