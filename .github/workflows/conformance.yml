name: conformance

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: typecheck · lint · validators · vitest · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Validate all manifests
        run: pnpm validate:all-manifests

      - name: Forbidden-API grep on add-ons
        run: pnpm check:addon-forbidden

      - name: Verify official add-on registry signatures
        run: pnpm verify:official

      - name: Verify shipped addon-sdk runtime is up to date
        run: |
          pnpm build:addon-sdk
          if [ -n "$(git status --porcelain apps/web/public/addons examples)" ]; then
            echo "::error::shipped senn-addon-sdk.js is stale; run 'pnpm build:addon-sdk' and commit"
            git --no-pager diff -- apps/web/public/addons examples
            exit 1
          fi

      - name: Verify shipped web registry is up to date
        run: |
          pnpm build:web-registry
          if [ -n "$(git status --porcelain apps/web/public/registry)" ]; then
            echo "::error::apps/web/public/registry/official/index.json is stale; run 'pnpm build:web-registry' and commit"
            git --no-pager diff -- apps/web/public/registry
            exit 1
          fi

      - name: Validate invite fixture
        run: pnpm validate:invite examples/invite-roundtrip/payload.json

      - name: Validate bundle fixture
        run: pnpm validate:bundle examples/signaling-url-fragment-roundtrip/bundle.json

      - name: Vitest (workspace)
        run: pnpm test

      - name: Build apps/web
        run: pnpm --filter @senn/web build

  e2e:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: static
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        run: |
          version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}

      - name: Install Playwright browser (with system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @senn/web exec playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @senn/web exec playwright install-deps ${{ matrix.browser }}

      - name: Run e2e
        run: pnpm --filter @senn/web e2e --project=${{ matrix.browser }}
        env:
          CI: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/web/playwright-report
          retention-days: 7
